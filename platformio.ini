; PlatformIO Project Configuration File
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/browser_tls_link.py
upload_speed = 921600
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
; This module's flash reliably boots in DIO mode.  QIO images reset in the
; ROM loader before the application starts on the installed ESP32-S3 board.
board_build.flash_mode = dio
board_build.f_flash = 80000000L
build_src_filter = +<*> -<ui/generated/> +<ui/generated/images/> +<ui/generated/*.c> +<ui/generated/guider_fonts/*.c> +<ui/custom/*.c> -<ui/custom/pinyin_full_dict.c> -<ui/generated/guider_fonts/lv_font_SourceHanSerifSC_Regular_16.c> -<ui/generated/guider_fonts/lv_font_chinese_city_32.c>
lib_extra_dirs = include
lib_deps =
	https://github.com/lvgl/lvgl.git#v8.3.1
	https://github.com/mmMicky/TouchLib.git
	adafruit/Adafruit MPU6050@^2.2.4
	adafruit/Adafruit Unified Sensor@^1.1.14
	bblanchon/ArduinoJson@^6.21.3
	links2004/WebSockets@^2.6.1
build_flags = 
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DLV_CONF_INCLUDE_SIMPLE
	-DLV_COLOR_DEPTH=16
	-DLV_COLOR_16_SWAP=0
	-DLV_TICK_CUSTOM=1
	-I include
	-I src
	-I src/ui
	-I src/ui/generated
	-I src/ui/generated/images
	-I src/ui/custom
	-I .pio/libdeps/esp32-s3-devkitc-1/lvgl/src/extra/others/ime
	-D LV_CONF_INCLUDE_SIMPLE=1


